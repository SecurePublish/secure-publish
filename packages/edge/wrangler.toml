name = "secure-publish"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Create the namespace once:
#   npx wrangler kv namespace create PANELS
# then paste the id below.
[[kv_namespaces]]
binding = "PANELS"
id = "46d61ee3d1f7410fa081e383b776934a"
preview_id = "46d61ee3d1f7410fa081e383b776934a"

# ─── Custom domains / routes — wildcard LIVE (2026-10-02) ───
# Dashboard attached: *.securepublish.work/* → this Worker
# Apex/www stay on Pages. Fallback: workers_dev = true
# See docs/DEPLOY-WILDCARD.md
#
[[routes]]
pattern = "*.securepublish.work/*"
zone_name = "securepublish.work"

# ─── Console CORS (exact Pages origin(s), comma-separated) ───
# app.securepublish.work + Pages + local pairing
[vars]
OAUTH_ALLOWED_DOMAINS = "wises.com.br"
CONSOLE_ORIGIN = "https://app.securepublish.work,https://secure-publish-app.pages.dev,http://127.0.0.1:8765"

# ─── SSO (prefer Cloudflare Access) — usually secrets, not vars ───
# TEAM_DOMAIN / POLICY_AUD via dashboard or wrangler secret/var
# Worker OAuth secrets: wrangler secret put SESSION_SECRET GOOGLE_* GITHUB_* MICROSOFT_*
# Local only (NEVER production): SSO_DEV_BYPASS=1 in .dev.vars
